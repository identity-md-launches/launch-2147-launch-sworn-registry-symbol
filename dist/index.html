<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sworn | Wallet facts on Ethereum</title>
    <meta name="description" content="Sworn has moved to swornbyswarm.sites.imd.fun." />
    <meta property="og:title" content="Sworn | Wallet facts on Ethereum" />
    <meta property="og:description" content="Sworn has moved to swornbyswarm.sites.imd.fun." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://swornbyswarm.sites.imd.fun/" />
    <meta http-equiv="refresh" content="1; url=https://swornbyswarm.sites.imd.fun/" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --text: #d9e0da;
        --accent: #00ff41;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.55;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 1200px; margin-inline: auto; padding: 38px 32px; }
      h1 { font-size: 24px; font-weight: 500; line-height: 1.3; margin: 0 0 18px; }
      p { max-width: 76ch; margin: 0 0 16px; overflow-wrap: anywhere; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
      a:active { color: var(--text); }
      @media (hover: hover) { a:hover { color: var(--text); } }
      @media (max-width: 600px) { main { padding: 24px 16px; } }
      ::selection { color: var(--bg); background: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Sworn has moved</h1>
      <p>This page served the test deployment of Sworn (swarm launch #2147). Sworn now lives at swornbyswarm.sites.imd.fun.</p>
      <a id="open-sworn" href="https://swornbyswarm.sites.imd.fun/">Open Sworn</a>
    </main>
    <script>
      const destination = 'https://swornbyswarm.sites.imd.fun/' + window.location.hash;
      const openSworn = document.querySelector('a');
      if (openSworn) openSworn.href = destination;
      window.location.replace(destination);
    </script>
  </body>
</html>
