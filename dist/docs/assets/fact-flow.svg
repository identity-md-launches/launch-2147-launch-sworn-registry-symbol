<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">From a rule to a reusable wallet fact</title>
<desc id="desc">An immutable rule becomes an exact composed question. The IMD panel and configured signer return an answer. The Registry validates its bindings and stores the fact. Applications query hasTrait; the optional Renderer separately draws a card. Direct facts bypass the oracle path.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#65ed44"/></marker></defs>
<rect width="1200" height="480" fill="#090c09"/>
<g fill="#101610" stroke="#315131"><rect x="30" y="86" width="230" height="125"/><rect x="330" y="86" width="230" height="125"/><rect x="630" y="86" width="230" height="125"/><rect x="930" y="86" width="240" height="125"/><rect x="930" y="302" width="240" height="110"/></g>
<g font-family="monospace" fill="#d9e1d5" font-size="22"><text x="30" y="38" fill="#65ed44">THE ORACLE FACT PATH</text><text x="48" y="121">1 / Define a rule</text><text x="348" y="121">2 / Compose + ask</text><text x="648" y="121">3 / Validate + store</text><text x="948" y="121">4 / Read the fact</text><text x="948" y="337">Optional card</text></g>
<g font-family="monospace" fill="#9eac9b" font-size="18"><text x="48" y="159">Template + parameters</text><text x="48" y="187">Immutable rule ID</text><text x="348" y="159">Exact question/window</text><text x="348" y="187">Panel → signed answer</text><text x="648" y="159">Registry checks</text><text x="648" y="187">Wallet-bound record</text><text x="948" y="159">hasTrait(wallet, id)</text><text x="948" y="187">Consumer's own policy</text><text x="948" y="373">Renderer reads facts</text><text x="948" y="397">An artifact, not a gate</text><text x="30" y="330">A request receipt starts the process; it is not a granted fact.</text><text x="30" y="362">Shared results require a separate wallet application.</text><text x="30" y="442">The Registry checks one configured attester signature; it does not replay all evidence.</text></g>
<g fill="none" stroke="#65ed44" stroke-width="2" marker-end="url(#arrow)"><path d="M260 149 H320"/><path d="M560 149 H620"/><path d="M860 149 H920"/><path d="M745 211 V357 H920"/></g>
</svg>
